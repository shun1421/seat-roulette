<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="座席ルーレット">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>座席ルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen classroom — chalkboard-green "room" holds the desk grid and the 教卓; control panel beside it (landscape) or below (portrait). */
:root {
  --paper: #ECEFE7;
  --ink: #1D2722;
  --muted: #5E6B64;
  --line: #C9D1C8;
  --surface: #F7F9F4;
  --board: #2E4A3B;
  --board-edge: #24392E;
  --chalk-ink: #E8EEE6;
  --chalk-dim: rgba(232, 238, 230, 0.38);
  --desk: #D8B786;
  --desk-edge: #B38F5C;
  --desk-ink: #3B2A16;
  --hit: #FFD54A;
  --hit-glow: rgba(255, 213, 74, 0.55);
  --go: #2F7A50;
  --go-ink: #FFFFFF;
  --stop: #C2452D;
  --absent: #8B958F;
  --on-group: #FFFFFF;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111714; --ink: #E2E8E3; --muted: #93A199; --line: #2A3530; --surface: #18201C;
    --board: #1E3328; --board-edge: #162820; --chalk-ink: #E2E9E1; --chalk-dim: rgba(226,233,225,0.32);
    --desk: #B9965F; --desk-edge: #8E6F40; --desk-ink: #241808;
    --hit: #FFD54A; --hit-glow: rgba(255,213,74,0.5); --go: #3A9663; --go-ink: #FFFFFF; --stop: #D4573E; --absent: #5F6A64;
    --on-group: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111714; --ink: #E2E8E3; --muted: #93A199; --line: #2A3530; --surface: #18201C;
  --board: #1E3328; --board-edge: #162820; --chalk-ink: #E2E9E1; --chalk-dim: rgba(226,233,225,0.32);
  --desk: #B9965F; --desk-edge: #8E6F40; --desk-ink: #241808;
  --hit: #FFD54A; --hit-glow: rgba(255,213,74,0.5); --go: #3A9663; --go-ink: #FFFFFF; --stop: #D4573E; --absent: #5F6A64;
  --on-group: #FFFFFF;
  color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { font-family: var(--f-display); font-size: 20px; letter-spacing: 0.04em; margin-right: auto; white-space: nowrap; }
.brand small { font-family: var(--f-body); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-left: 6px; font-weight: 500; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--muted);
  min-height: 38px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--board); color: var(--chalk-ink); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; font-size: 15px; }
.sel {
  min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px; max-width: 12em;
}
.iconbtn { min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 12px; font-size: 14px; }

/* ---------- main ---------- */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
@media (orientation: landscape) and (min-width: 760px) {
  .main { flex-direction: row; }
  .panel { width: 300px; flex: none; overflow-y: auto; }
}
@media not ((orientation: landscape) and (min-width: 760px)) {
  .app { height: auto; min-height: 100%; }
  .room { height: min(66vh, 92vw); flex: none !important; }
}

.room {
  flex: 1; min-width: 0; min-height: 0; position: relative;
  background: var(--board); border: 6px solid var(--board-edge); border-radius: 14px;
  display: flex; flex-direction: column; padding: 12px; gap: 12px; box-sizing: border-box;
  background-image: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.05), transparent 60%);
}
.room.teacher { flex-direction: column-reverse; }
.podium-row { display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px; }
.podium {
  background: var(--desk-edge); color: var(--chalk-ink); border-radius: 6px;
  padding: 6px 34px; font-weight: 700; letter-spacing: 0.4em; font-size: 15px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18);
}
.viewtag {
  position: absolute; left: 0; font-size: 12px; color: var(--chalk-dim); letter-spacing: 0.06em;
  border: 1px dashed var(--chalk-dim); border-radius: 6px; padding: 2px 8px;
}
.gridwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.grid { display: grid; gap: var(--gap, 8px); grid-template-columns: repeat(var(--cols), var(--cw, 60px)); grid-auto-rows: var(--ch, 46px); }

.cell {
  position: relative; border: 0; padding: 0; border-radius: 7px; background: transparent;
  display: flex; align-items: center; justify-content: center; color: var(--desk-ink);
  font-variant-numeric: tabular-nums;
}
.cell.on {
  background: var(--desk);
  box-shadow: inset 0 calc(var(--ch) * -0.1) 0 var(--desk-edge);
}
/* 班の色：机の手前に色帯＋左上に班番号 */
.cell.on.grp { box-shadow: inset 0 calc(var(--ch) * -0.16) 0 var(--gcol); }
.edit.groups .cell.on.grp { background: color-mix(in srgb, var(--gcol) 42%, var(--desk)); }
.gbadge {
  position: absolute; top: 3px; left: 4px; height: calc(var(--ch) * 0.3); min-width: calc(var(--ch) * 0.3);
  padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--gcol); color: var(--on-group);
  font-size: calc(var(--ch) * 0.2); font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.cell .num { font-family: var(--f-display); font-size: calc(var(--ch) * 0.42); line-height: 1; padding-bottom: calc(var(--ch) * 0.06); }
.cell.absent, .cell.on.absent { background: var(--absent); color: var(--chalk-ink); opacity: 0.75; }
.cell.absent::after { content: "欠"; position: absolute; top: 3px; right: 5px; font-size: calc(var(--ch) * 0.2); font-weight: 700; }
.cell.done { opacity: 0.5; }
.cell.done::after { content: "済"; position: absolute; top: 3px; right: 5px; font-size: calc(var(--ch) * 0.2); font-weight: 700; color: var(--desk-ink); }
.cell.absent .num { opacity: 0.8; }
.cell.on.lit { background: var(--hit); opacity: 1; box-shadow: 0 0 0 3px var(--hit), 0 0 calc(var(--cw) * 0.45) var(--hit-glow); z-index: 2; }
.cell.on.chosen { background: var(--hit); opacity: 1; z-index: 3; box-shadow: 0 0 0 4px var(--hit), 0 0 calc(var(--cw) * 0.6) var(--hit-glow); animation: ring 1.1s ease-out 3; }
.cell.on.chosen.absent { background: var(--absent); box-shadow: 0 0 0 4px var(--hit); opacity: 0.8; }
@keyframes ring {
  0% { box-shadow: 0 0 0 4px var(--hit), 0 0 0 4px var(--hit-glow); transform: scale(1); }
  40% { transform: scale(1.08); }
  100% { box-shadow: 0 0 0 4px var(--hit), 0 0 0 calc(var(--cw) * 0.35) rgba(255,213,74,0); transform: scale(1); }
}

/* edit-mode cells */
.edit .cell { cursor: pointer; }
.edit .cell.off { border: 2px dashed var(--chalk-dim); color: var(--chalk-dim); font-size: calc(var(--ch) * 0.34); }
.edit.numbers .cell.off, .edit.groups .cell.off { border-style: dotted; opacity: 0.4; cursor: default; }
.cell input {
  width: 78%; height: 68%; box-sizing: border-box; text-align: center; border: 2px solid var(--desk-edge); border-radius: 6px;
  background: rgba(255,255,255,0.75); color: var(--desk-ink); font-family: var(--f-display); font-size: calc(var(--ch) * 0.32); padding: 0;
}
.pickmode .cell.on { cursor: pointer; outline: 2px dashed var(--chalk-dim); outline-offset: 2px; }

/* ---------- panel ---------- */
.panel { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); }
.result { min-height: 132px; justify-content: center; }
.result .big { font-family: var(--f-display); font-size: 64px; line-height: 1; display: flex; align-items: center; gap: 8px; }
.result .big small { font-size: 24px; align-self: flex-end; padding-bottom: 6px; }
.result .where { font-size: 15px; font-weight: 500; }
.result .idle { color: var(--muted); }
.gdot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--gcol); flex: none; }
.gdot.sm { width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }

.go {
  border: 0; border-radius: 14px; min-height: 76px; font-family: var(--f-display); font-size: 28px; letter-spacing: 0.2em;
  background: var(--go); color: var(--go-ink); box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2);
}
.go.spinning { background: var(--stop); }
.go:disabled { opacity: 0.6; cursor: default; }
.go:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.warn { font-size: 13px; color: var(--stop); font-weight: 500; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn {
  min-height: 40px; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 0 12px; font-size: 14px; font-weight: 500;
}
.btn.primary { background: var(--board); color: var(--chalk-ink); border-color: var(--board); }
.btn.danger { color: var(--stop); border-color: var(--stop); }
.btn[aria-pressed="true"] { background: var(--board); color: var(--chalk-ink); border-color: var(--board); }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--go); }
details > summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
details > summary::after { content: "＋"; color: var(--muted); }
details[open] > summary::after { content: "－"; }
details[open] > summary { margin-bottom: 8px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.history { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-size: 20px; line-height: 1; }
.stepper output { min-width: 2ch; text-align: center; font-family: var(--f-display); font-size: 22px; }
.sizes { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.text { min-height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); padding: 0 10px; width: 100%; box-sizing: border-box; }
select.text { width: auto; }

/* 班パレット */
.gpal { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.gbtn {
  min-height: 44px; border: 2px solid transparent; border-radius: 9px; background: var(--paper);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 14px; font-weight: 700; text-align: left; white-space: nowrap;
  box-shadow: inset 4px 0 0 var(--gcol);
}
.gbtn .cnt { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.gbtn[aria-pressed="true"] { border-color: var(--gcol); background: color-mix(in srgb, var(--gcol) 16%, var(--paper)); }

@media (prefers-reduced-motion: reduce) {
  .cell.on.chosen { animation: none; }
}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="bar">
    <div class="brand">座席ルーレット<small>指名用</small></div>
    <select class="sel" id="classSel" aria-label="クラスを選ぶ"></select>
    <div class="seg" role="group" aria-label="表示の向き">
      <button id="vStudent" aria-pressed="true">生徒に提示</button>
      <button id="vTeacher" aria-pressed="false">教師が確認</button>
    </div>
    <div class="seg" role="group" aria-label="モード">
      <button id="mRoulette" aria-pressed="true">ルーレット</button>
      <button id="mEdit" aria-pressed="false">座席を編集</button>
    </div>
    <button class="iconbtn" id="fsBtn">全画面</button>
  </header>

  <main class="main">
    <section class="room" id="room" aria-label="教室の座席">
      <div class="podium-row">
        <span class="viewtag" id="viewTag">生徒用表示</span>
        <div class="podium">教卓</div>
      </div>
      <div class="gridwrap" id="gridWrap"><div class="grid" id="grid"></div></div>
    </section>

    <!-- roulette panel -->
    <aside class="panel" id="panelRoulette">
      <div class="seg wide" role="group" aria-label="指名の対象">
        <button id="tSeat" aria-pressed="true">個人を指名</button>
        <button id="tGroup" aria-pressed="false">班を指名</button>
      </div>
      <div class="card result" id="result" aria-live="polite"></div>
      <button class="go" id="goBtn">スタート</button>
      <div class="card">
        <details id="optDetails">
          <summary>設定と欠席</summary>
          <div class="opts">
            <label class="check"><input type="checkbox" id="optExclude" checked> 当たった席・班は次から除く</label>
            <label class="check"><input type="checkbox" id="optNums" checked> 座席に出席番号を表示</label>
            <label class="check"><input type="checkbox" id="optGroups" checked> 座席に班の色を表示</label>
            <label class="check"><input type="checkbox" id="optSound"> 効果音を鳴らす</label>
            <div class="row" style="margin-top:6px">
              <button class="btn" id="absentBtn" aria-pressed="false">欠席の席をタップで選ぶ</button>
            </div>
            <div class="row">
              <button class="btn" id="resetPicked">当たりをリセット</button>
              <button class="btn" id="resetAbsent">欠席をリセット</button>
            </div>
          </div>
        </details>
      </div>
      <div class="card" id="historyCard">
        <div class="label" id="historyLabel">これまでの指名</div>
        <div class="history" id="history"></div>
      </div>
    </aside>

    <!-- edit panel -->
    <aside class="panel" id="panelEdit" hidden>
      <div class="card">
        <div class="label">クラス</div>
        <input class="text" id="className" aria-label="クラス名">
        <div class="row">
          <button class="btn" id="addClass">＋ クラスを追加</button>
          <button class="btn danger" id="delClass">削除</button>
        </div>
        <div class="row" id="delConfirm" hidden>
          <span class="warn">このクラスを削除しますか？</span>
          <button class="btn danger" id="delYes">削除する</button>
          <button class="btn" id="delNo">やめる</button>
        </div>
      </div>
      <div class="card">
        <div class="seg" role="group" aria-label="編集する内容" style="align-self:flex-start">
          <button id="eLayout" aria-pressed="true">席の配置</button>
          <button id="eNumbers" aria-pressed="false">出席番号</button>
          <button id="eGroups" aria-pressed="false">班分け</button>
        </div>
        <div id="layoutTools" class="opts" style="gap:10px">
          <div class="sizes">
            <span>縦（前→後）</span>
            <div class="stepper"><button id="rMinus" aria-label="行を減らす">−</button><output id="rOut">6</output><button id="rPlus" aria-label="行を増やす">＋</button><span class="note">行</span></div>
            <span>横（左→右）</span>
            <div class="stepper"><button id="cMinus" aria-label="列を減らす">−</button><output id="cOut">6</output><button id="cPlus" aria-label="列を増やす">＋</button><span class="note">列</span></div>
          </div>
          <div class="row">
            <button class="btn" id="fillAll">すべて席にする</button>
            <button class="btn" id="grid77">7×7から選ぶ</button>
          </div>
          <p class="note">座席をタップすると「席あり／なし」が切り替わります。通路や空きは「なし」に。</p>
        </div>
        <div id="numberTools" class="opts" style="gap:10px" hidden>
          <p class="note">各席に出席番号を入力します（空欄でも使えます）。</p>
          <div class="row">
            <select class="text" id="numDir" aria-label="連番の向き">
              <option value="v">縦に連番</option>
              <option value="h">横に連番</option>
            </select>
            <select class="text" id="numStart" aria-label="連番の開始位置">
              <option value="L">黒板に向かって左前から</option>
              <option value="R">黒板に向かって右前から</option>
            </select>
          </div>
          <div class="row">
            <button class="btn primary" id="autoNum">連番を振る</button>
            <button class="btn" id="clearNum">番号を消す</button>
          </div>
        </div>
        <div id="groupTools" class="opts" style="gap:10px" hidden>
          <div class="sizes">
            <span>班の数</span>
            <div class="stepper"><button id="gMinus" aria-label="班を減らす">−</button><output id="gOut">6</output><button id="gPlus" aria-label="班を増やす">＋</button><span class="note">班</span></div>
          </div>
          <div class="label">割り当てる班を選ぶ</div>
          <div class="gpal" id="gPal"></div>
          <p class="note">班を選んでから座席をタップします。同じ班の席をもう一度タップすると解除されます。</p>
          <div class="row">
            <button class="btn" id="gAuto">2列ずつ前から自動で分ける</button>
            <button class="btn" id="gClear">班分けを消す</button>
          </div>
        </div>
      </div>
      <p class="note">設定はこの端末のブラウザに保存されます。</p>
    </aside>
  </main>
</div>

<script>
(function () {
  "use strict";
  var KEY = "seat-roulette-v1";
  var MAX = 9, GMAX = 12;
  var GCOL = ["#E0533F", "#2F7FD0", "#2E9E57", "#E8961E", "#8A55CC", "#16A39D", "#D64F93", "#7C8E1F", "#4E5FD6", "#B0621C", "#3BA9DE", "#A33C5C"];

  function makeSeats(rows, cols, on) {
    var s = [];
    for (var r = 0; r < rows; r++) { var row = []; for (var c = 0; c < cols; c++) row.push({ on: on, num: "" }); s.push(row); }
    return s;
  }
  function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function sampleClass() {
    var s = makeSeats(6, 6, true), n = 1, map = {};
    for (var c = 0; c < 6; c++) for (var r = 0; r < 6; r++) s[r][c].num = String(n++);
    s[5][5].on = false; s[5][5].num = ""; s[5][4].on = false; s[5][4].num = "";
    for (var r2 = 0; r2 < 6; r2++) for (var c2 = 0; c2 < 6; c2++) if (s[r2][c2].on) map[r2 + "-" + c2] = Math.floor(r2 / 3) * 3 + Math.floor(c2 / 2);
    return { id: uid(), name: "1年1組（例）", rows: 6, cols: 6, seats: s, groups: { count: 6, map: map } };
  }
  function normalize(c) { if (!c.groups || typeof c.groups !== "object") c.groups = { count: 6, map: {} }; if (!c.groups.map) c.groups.map = {}; return c; }

  var state = { classes: [], currentId: null, view: "student", target: "seat", opts: { exclude: true, nums: true, groups: true, sound: false } };
  try {

    save(); renderGrid();
  });
  $("clearNum").addEventListener("click", function () { cls().seats.forEach(function (row) { row.forEach(function (x) { x.num = ""; }); }); save(); renderGrid(); });

  // 班分け
  function setGroupCount(n) {
    var c = cls();
    n = Math.max(1, Math.min(GMAX, n));
    c.groups.count = n;
    Object.keys(c.groups.map).forEach(function (k) { if (c.groups.map[k] >= n) delete c.groups.map[k]; });
    resetSession(); save(); renderGPal(); renderGrid();
  }
  $("gMinus").addEventListener("click", function () { setGroupCount(cls().groups.count - 1); });
  $("gPlus").addEventListener("click", function () { setGroupCount(cls().groups.count + 1); });
  $("gPal").addEventListener("click", function (e) {
    var b = e.target.closest(".gbtn"); if (!b) return;
    currentG = +b.dataset.g; renderGPal();
  });
  $("gAuto").addEventListener("click", function () {
    // 黒板に向かって左から2列ずつ、前から順に席を並べ、班の数で均等に区切る
    var c = cls(), order = [];
    for (var p = 0; p < c.cols; p += 2)
      for (var r = 0; r < c.rows; r++)
        for (var col = p; col < Math.min(p + 2, c.cols); col++)
          if (c.seats[r][col].on) order.push(r + "-" + col);
    var n = c.groups.count, base = Math.floor(order.length / n), extra = order.length % n, idx = 0;
    c.groups.map = {};
    for (var g = 0; g < n; g++) {
      var size = base + (g < extra ? 1 : 0);
      for (var j = 0; j < size; j++) c.groups.map[order[idx++]] = g;
    }
    resetSession(); save(); renderGPal(); renderGrid();
  });
  $("gClear").addEventListener("click", function () { cls().groups.map = {}; resetSession(); save(); renderGPal(); renderGrid(); });

  $("addClass").addEventListener("click", function () {
    var nc = { id: uid(), name: "新しいクラス " + (state.classes.length + 1), rows: 6, cols: 6, seats: makeSeats(6, 6, true), groups: { count: 6, map: {} } };
    state.classes.push(nc); state.currentId = nc.id; currentG = 0; save(); renderAll(); $("className").focus(); $("className").select();
  });
  $("delClass").addEventListener("click", function () { $("delConfirm").hidden = false; });
  $("delNo").addEventListener("click", function () { $("delConfirm").hidden = true; });
  $("delYes").addEventListener("click", function () {
    if (state.classes.length < 2) return;
    var id = state.currentId;
    state.classes = state.classes.filter(function (c) { return c.id !== id; });
    delete session[id]; state.currentId = state.classes[0].id; $("delConfirm").hidden = true; save(); renderAll();
  });

  renderAll();
})();
</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
